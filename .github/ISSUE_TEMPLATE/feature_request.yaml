name: Feature Request
description: Propose a new feature, optimization, or language backend for Fish
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature to make Fish better!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or limitation?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or workflow you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you have considered.
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - Core & DAG Engine
        - Scheduler & Concurrency
        - Cache & CAS Storage
        - Language Backend
        - CLI & Developer Experience
        - Web UI & Dashboard
        - Distributed Workers / Remote Cache
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a Pull Request for this feature.
