name: AI Issue Doctor

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Analyze Issue with AI Doctor
        id: doctor
        env:
          AI_MODEL_API_1: ${{ secrets.AI_MODEL_API_1 || secrets.AI_API_KEY_1 }}
          AI_MODEL_1: ${{ secrets.AI_MODEL_1 }}
          AI_ENDPOINT_1: ${{ secrets.AI_ENDPOINT_1 }}
          AI_MODEL_API_2: ${{ secrets.AI_MODEL_API_2 || secrets.AI_API_KEY_2 }}
          AI_MODEL_2: ${{ secrets.AI_MODEL_2 }}
          AI_ENDPOINT_2: ${{ secrets.AI_ENDPOINT_2 }}
          AI_MODEL_API_3: ${{ secrets.AI_MODEL_API_3 || secrets.AI_API_KEY_3 }}
          AI_MODEL_3: ${{ secrets.AI_MODEL_3 }}
          AI_ENDPOINT_3: ${{ secrets.AI_ENDPOINT_3 }}
          AI_MODEL_API_4: ${{ secrets.AI_MODEL_API_4 || secrets.AI_API_KEY_4 }}
          AI_MODEL_4: ${{ secrets.AI_MODEL_4 }}
          AI_ENDPOINT_4: ${{ secrets.AI_ENDPOINT_4 }}
          AI_MODEL_API_5: ${{ secrets.AI_MODEL_API_5 || secrets.AI_API_KEY_5 }}
          AI_MODEL_5: ${{ secrets.AI_MODEL_5 }}
          AI_ENDPOINT_5: ${{ secrets.AI_ENDPOINT_5 }}
          AI_MODEL_API_6: ${{ secrets.AI_MODEL_API_6 || secrets.AI_API_KEY_6 }}
          AI_MODEL_6: ${{ secrets.AI_MODEL_6 }}
          AI_ENDPOINT_6: ${{ secrets.AI_ENDPOINT_6 }}
          AI_MODEL_API_7: ${{ secrets.AI_MODEL_API_7 || secrets.AI_API_KEY_7 }}
          AI_MODEL_7: ${{ secrets.AI_MODEL_7 }}
          AI_ENDPOINT_7: ${{ secrets.AI_ENDPOINT_7 }}
          AI_MODEL_API_8: ${{ secrets.AI_MODEL_API_8 || secrets.AI_API_KEY_8 }}
          AI_MODEL_8: ${{ secrets.AI_MODEL_8 }}
          AI_ENDPOINT_8: ${{ secrets.AI_ENDPOINT_8 }}
          AI_MODEL_API_9: ${{ secrets.AI_MODEL_API_9 || secrets.AI_API_KEY_9 }}
          AI_MODEL_9: ${{ secrets.AI_MODEL_9 }}
          AI_ENDPOINT_9: ${{ secrets.AI_ENDPOINT_9 }}
          AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.GEMINI_API_KEY || secrets.OPENAI_API_KEY || secrets.GROQ_API_KEY }}
          AI_API_KEYS: ${{ secrets.AI_API_KEYS || secrets.GEMINI_API_KEYS }}
          AI_MODEL: ${{ secrets.AI_MODEL || vars.AI_MODEL || secrets.GEMINI_MODEL }}
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT || secrets.AI_BASE_URL }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          PROMPT="You are FishBot Doctor, an AI triage assistant for the Fish build system repository.
          Author: @$ISSUE_AUTHOR
          Issue Title: $ISSUE_TITLE
          Issue Body:
          $ISSUE_BODY

          Analyze this issue:
          1. If it contains a bug, compilation failure, toolchain issue, or \`fish doctor\` output, diagnose the root cause and provide actionable, step-by-step fix commands.
          2. If it is a feature request or question, provide a polite and helpful response.
          3. Recommend 1-3 labels (from: bug, question, enhancement, documentation, os:windows, os:linux, os:macos, toolchain:rust, toolchain:cc, toolchain:go, toolchain:ts, cache:remote).
          Format your answer in clean GitHub Markdown."

          AI_TEXT=$(python scripts/universal_ai.py --prompt "$PROMPT" || true)

          if [ -z "$AI_TEXT" ]; then
            AI_TEXT="Hello @$ISSUE_AUTHOR! 👋 Thank you for opening this issue. A maintainer will review it shortly. If you encountered an error, please ensure you have attached the output of \`fish doctor\`."
          fi

          echo "reply<<EOF" >> $GITHUB_OUTPUT
          echo "$AI_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Reply to Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const replyBody = process.env.REPLY_BODY;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: replyBody
            });
        env:
          REPLY_BODY: ${{ steps.doctor.outputs.reply }}
