name: AI Release & Packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: fish-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: fish-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: fish-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: fish-macos-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: |
          cargo build --release -p fish-cli --bin fish --target ${{ matrix.target }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo build --release -p fish-installer --bin fish-setup --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Stage Artifact
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/fish.exe ./${{ matrix.artifact_name }}
            cp target/${{ matrix.target }}/release/fish-setup.exe ./fish-setup-windows-x86_64.exe
          else
            cp target/${{ matrix.target }}/release/fish ./${{ matrix.artifact_name }}
          fi

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            fish-setup-windows-x86_64.exe
          if-no-files-found: ignore

  create-release:
    name: Create AI GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums & AI Release Notes
        id: release_notes
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.GEMINI_API_KEY || secrets.OPENAI_API_KEY || secrets.GROQ_API_KEY }}
          AI_API_KEYS: ${{ secrets.AI_API_KEYS || secrets.GEMINI_API_KEYS }}
          AI_MODEL: ${{ secrets.AI_MODEL || vars.AI_MODEL || secrets.GEMINI_MODEL }}
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT || secrets.AI_BASE_URL }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd release-artifacts
          ls -la
          sha256sum fish-* > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true
          cd ..

          COMMITS=$(git log -n 25 --oneline)
          PROMPT="You are FishBot, releasing version $TAG_NAME of the Fish build system.
          Recent Git Commit History:
          $COMMITS

          Generate an outstanding, developer-friendly Release Notes in Markdown.
          Sections to include:
          - What's New / Highlights
          - Performance & Core Engine Improvements
          - Language Backends & Tooling
          - Installation & Download Instructions
          Keep it clean, exciting, and professional."

          NOTES=$(python scripts/universal_ai.py --prompt "$PROMPT" || true)

          if [ -z "$NOTES" ]; then
            NOTES="## Release $TAG_NAME

          ### Highlights
          - High performance build orchestration
          - Polyglot backend execution and incremental caching
          - Windows Setup Installer app (fish-setup-windows-x86_64.exe) with multi-language support (EN, VI, ZH-CN, ZH-TW, JA) and PATH configuration

          ### Commits
          \`\`\`
          $COMMITS
          \`\`\`"
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.app-token.outputs.token || secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          files: |
            release-artifacts/*
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
