name: Backend-Specific Testing

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-backends:
    name: Core Language Backends Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust, CC, Go, TS, Python backends
        run: cargo test -p fish-backend-rust -p fish-backend-cc -p fish-backend-go -p fish-backend-ts -p fish-backend-py --lib

  extended-backends:
    name: Extended Language Backends Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test Java, Dotnet, Swift, Dart, Zig, Docker backends
        run: cargo test -p fish-backend-java -p fish-backend-dotnet -p fish-backend-swift -p fish-backend-dart -p fish-backend-zig -p fish-backend-docker --lib

  go-services:
    name: Go Networking Services Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - name: Run Go tests
        working-directory: go
        run: go test -v ./...

  python-ai-services:
    name: Python AI Services Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run Python unit tests
        working-directory: py
        run: python -m unittest discover tests