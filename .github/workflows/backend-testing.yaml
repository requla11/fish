name: Backend-Specific Testing

on:
  workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changed Languages
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      vscode: ${{ steps.filter.outputs.vscode }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            go:
              - 'go/**'
            python:
              - 'py/**'
            vscode:
              - 'vscode-extension/**'

  core-backends:
    name: Core Language Backends Testing
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust, CC, Go, TS, Python backends
        run: cargo test -p fish-backend-rust -p fish-backend-cc -p fish-backend-go -p fish-backend-ts -p fish-backend-py --lib

  extended-backends:
    name: Extended Language Backends Testing
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test Java, Dotnet, Swift, Dart, Zig, Docker backends
        run: cargo test -p fish-backend-java -p fish-backend-dotnet -p fish-backend-swift -p fish-backend-dart -p fish-backend-zig -p fish-backend-docker --lib

  go-services:
    name: Go Networking Services Testing
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run Go tests
        working-directory: go
        run: go test -v ./...

  python-ai-services:
    name: Python AI Services Testing
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python unit tests
        working-directory: py
        run: python -m unittest discover tests

  vscode-extension:
    name: VS Code Extension Testing
    needs: changes
    if: ${{ needs.changes.outputs.vscode == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies and test
        working-directory: vscode-extension
        run: |
          npm ci
          npm run compile
          npm run lint