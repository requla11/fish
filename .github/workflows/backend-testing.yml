name: Backend-Specific Testing

on:
  push:
    branches: [ main, develop, dev ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # C/C++ Backend Testing
  cc-backend:
    name: C/C++ Backend Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install C/C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang cmake make
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Test C/C++ backend integration
        run: cargo test -p forge-backend-cc
      
      - name: Test C/C++ backend
        run: cargo test -p forge-backend-cc
        continue-on-error: true

  # Java Backend Testing
  java-backend:
    name: Java Backend Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Java toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk maven gradle
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Test Java backend
        run: cargo test -p forge-backend-java
        continue-on-error: true

  # Go Backend Testing
  go-backend:
    name: Go Backend Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Go toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Test Go backend
        run: cargo test -p forge-backend-go
        continue-on-error: true

  # Python Backend Testing
  python-backend:
    name: Python Backend Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pipenv poetry
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Test Python backend
        run: cargo test -p forge-backend-py
        continue-on-error: true

  # TypeScript/JavaScript Backend Testing
  typescript-backend:
    name: TypeScript/JavaScript Backend Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['16', '18', '20']
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install Node dependencies
        run: npm install -g yarn pnpm
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Test TypeScript backend
        run: cargo test -p forge-backend-ts
        continue-on-error: true

  # Rust Backend Testing
  rust-backend:
    name: Rust Backend Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Test Rust backend
        run: cargo test -p forge-backend-rust
        continue-on-error: true

  # .NET Backend Testing
  dotnet-backend:
    name: .NET Backend Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Test .NET backend
        run: cargo test -p forge-backend-dotnet
        continue-on-error: true

  # Backend Summary
  backend-summary:
    name: Backend Summary
    runs-on: ubuntu-latest
    needs: [cc-backend, java-backend, go-backend, python-backend, typescript-backend, rust-backend, dotnet-backend]
    if: always()
    steps:
      - name: Check backend test results
        run: |
          echo "C/C++ Backend: ${{ needs.cc-backend.result }}"
          echo "Java Backend: ${{ needs.java-backend.result }}"
          echo "Go Backend: ${{ needs.go-backend.result }}"
          echo "Python Backend: ${{ needs.python-backend.result }}"
          echo "TypeScript Backend: ${{ needs.typescript-backend.result }}"
          echo "Rust Backend: ${{ needs.rust-backend.result }}"
          echo ".NET Backend: ${{ needs.dotnet-backend.result }}"
          
          failed_backends=0
          [ "${{ needs.cc-backend.result }}" != "success" ] && ((failed_backends++))
          [ "${{ needs.java-backend.result }}" != "success" ] && ((failed_backends++))
          [ "${{ needs.go-backend.result }}" != "success" ] && ((failed_backends++))
          [ "${{ needs.python-backend.result }}" != "success" ] && ((failed_backends++))
          [ "${{ needs.typescript-backend.result }}" != "success" ] && ((failed_backends++))
          [ "${{ needs.rust-backend.result }}" != "success" ] && ((failed_backends++))
          [ "${{ needs.dotnet-backend.result }}" != "success" ] && ((failed_backends++))
          
          if [ $failed_backends -gt 0 ]; then
            echo "❌ $failed_backends backend(s) failed"
            exit 1
          else
            echo "✅ All backends passed"
          fi