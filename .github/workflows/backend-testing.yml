name: Backend-Specific Testing

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-backends:
    name: Core Language Backends Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust, CC, Go, TS, Python backends
        run: cargo test -p forge-backend-rust -p forge-backend-cc -p forge-backend-go -p forge-backend-ts -p forge-backend-py --lib

  extended-backends:
    name: Extended Language Backends Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test Java, Dotnet, Swift, Dart, Zig, Docker backends
        run: cargo test -p forge-backend-java -p forge-backend-dotnet -p forge-backend-swift -p forge-backend-dart -p forge-backend-zig -p forge-backend-docker --lib