name: Comprehensive CI

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  workspace-test:
    name: Workspace Tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-comp-${{ hashFiles('**/Cargo.lock') }}
      - name: Run all workspace tests
        run: cargo test --workspace

  quality-gate:
    name: Quality Checks
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting check
        run: cargo fmt --all -- --check
      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings

  integration-gate:
    name: Integration Tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run CLI integration tests
        run: cargo test -p fish-cli --test build

  build:
    name: build
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        run: cargo build --release
      - name: Verify CLI binary execution
        run: |
          ./target/release/fish --version
          ./target/release/fish --help
          ./target/release/fish doctor

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [workspace-test, quality-gate, integration-gate, build]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.workspace-test.result }}" = "failure" ] || \
             [ "${{ needs.quality-gate.result }}" = "failure" ] || \
             [ "${{ needs.integration-gate.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ]; then
            echo "CI Failed"
            exit 1
          fi
          echo "All Comprehensive CI checks passed or skipped"