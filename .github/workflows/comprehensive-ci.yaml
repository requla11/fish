name: Comprehensive CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
        run: cargo fmt --all -- --check

  docs-drift:
    name: CLI Docs Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate CLI reference
        run: cargo run -p fish-cli --quiet -- gen-docs
      - name: Fail if docs/cli-reference.md is stale
        run: |
          git diff --exit-code -- docs/cli-reference.md || {
            echo "::error::docs/cli-reference.md is out of date. Run 'cargo run -p fish-cli -- gen-docs' and commit."
            exit 1
          }

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
      - name: Run all workspace tests
        run: cargo test --workspace --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check workspace against MSRV
        run: cargo check --workspace --all-targets --locked

  python-tests:
    name: Python AI Layer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run AI layer test suite
        working-directory: py
        env:
          PYTHONPATH: ${{ github.workspace }}/py
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  go-tests:
    name: Go Control Plane Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Vet control plane modules
        working-directory: go
        run: go vet ./...
      - name: Run control plane tests
        working-directory: go
        run: go test ./...

  supply-chain:
    name: Supply Chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate dependencies against deny.toml
        uses: EmbarkStudios/cargo-deny-action@v2

  ci-status:
    name: CI Status
    needs:
      - fmt
      - clippy
      - test
      - msrv
      - python-tests
      - go-tests
      - supply-chain
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate job results
        run: |
          failed=0
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in
              success|skipped) ;;
              *) failed=1; echo "job result: $result" ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "Comprehensive CI failed"
            exit 1
          fi
          echo "Comprehensive CI passed"
