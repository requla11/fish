name: Comprehensive CI

on:
  push:
    branches: [ main, develop, dev ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::result_large_err
      
      - name: Check documentation
        run: cargo doc --workspace --no-deps --all-features

  workspace-tests:
    name: Workspace Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run all workspace tests
        run: cargo test --workspace --all-targets --all-features
      
      - name: Run doc tests
        run: cargo test --workspace --doc

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: workspace-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run integration tests
        run: cargo test --workspace --test '*'

  build-and-dogfood:
    name: Build Verification & Dogfooding
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-release-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build workspace release
        run: cargo build --workspace --release
      
      - name: Build CLI binary
        run: cargo build -p forge-cli --release
      
      - name: Test forge build
        run: ./target/release/forge build --no-cache
      
      - name: Test forge check
        run: ./target/release/forge check --no-cache
      
      - name: Test forge test
        run: ./target/release/forge test --no-cache
      
      - name: Test forge graph
        run: ./target/release/forge graph --format dot
      
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: forge-cli-binary
          path: target/release/forge

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [quality-checks, workspace-tests, integration-tests, build-and-dogfood]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "Quality Checks: ${{ needs.quality-checks.result }}"
          echo "Workspace Tests: ${{ needs.workspace-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Build & Dogfood: ${{ needs.build-and-dogfood.result }}"
          
          if [ "${{ needs.quality-checks.result }}" != "success" ] || \
             [ "${{ needs.workspace-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.build-and-dogfood.result }}" != "success" ]; then
            echo "CI Pipeline Failed"
            exit 1
          else
            echo "CI Pipeline Passed"
          fi