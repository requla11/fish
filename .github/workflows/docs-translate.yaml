name: Auto Translate Docs

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-translation of all documents'
        required: false
        type: boolean
        default: false
      languages:
        description: 'Target languages (comma separated: vi,zh-hans,zh-hant,ja)'
        required: false
        default: 'vi,zh-hans,zh-hant,ja'

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    name: Translate Documentation (Gemini 3.7 Flash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run automated documentation translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/translate_docs.py --all --lang "${{ github.event.inputs.languages }}" $FORCE_FLAG

      - name: Verify VitePress build
        run: npm run docs:build

      - name: Create Pull Request with Translations
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(i18n): automated documentation translation via Gemini 3.7 Flash"
          title: "docs(i18n): sync multilingual documentation via Gemini 3.7 Flash"
          body: |
            ### 🌐 Automated Documentation Translation
            - **Model Used**: Gemini 3.7 Flash (`gemini-3.7-flash`)
            - **Languages Updated**: ${{ github.event.inputs.languages }}
            - **Verification**: VitePress build completed successfully with 0 errors.
          branch: "automation/docs-translate"
          delete-branch: true
