name: dogfood

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  fish:
    name: Fish builds Fish (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-dogfood

      - name: Bootstrap Fish CLI
        run: cargo build -p fish-cli --release

      - name: Fish Target Algebra Build (//...)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/fish.exe build //...
          else
            ./target/release/fish build //...
          fi

      - name: Fish Zero-Config Test Suite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/fish.exe test --no-cache
          else
            ./target/release/fish test --no-cache
          fi

      - name: Fish DAG Graph Export
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/fish.exe graph --format dot
          else
            ./target/release/fish graph --format dot
          fi

      - name: Fish Doctor Self-Diagnostic
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/fish.exe doctor
          else
            ./target/release/fish doctor
          fi

      - name: Dogfood Polyglot Monorepo Example
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/fish.exe build -C examples/polyglot-demo
          else
            ./target/release/fish build -C examples/polyglot-demo
          fi
