name: dogfood

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'

env:
  CARGO_TERM_COLOR: always

jobs:
  fish:
    name: Fish builds Fish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap Fish
        run: cargo build -p fish-cli

      - name: Fish build
        run: ./target/debug/fish build

      - name: Fish check
        run: ./target/debug/fish check --no-cache

      - name: Fish test
        run: ./target/debug/fish test --no-cache

      - name: Fish graph
        run: ./target/debug/fish graph --format dot

      - name: Fish run
        run: ./target/debug/fish run -p fish-cli --bin fish -- --version
