name: dogfood

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'

env:
  CARGO_TERM_COLOR: always

jobs:
  Fish:
    name: Fish builds Fish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap Fish
        run: cargo build --locked

      - name: Fish build
        run: ./target/debug/Fish build

      - name: Fish check
        run: ./target/debug/Fish check --no-cache

      - name: Fish test
        run: ./target/debug/Fish test --no-cache

      - name: Fish graph
        run: ./target/debug/Fish graph --format dot

      - name: Fish run
        run: ./target/debug/Fish run -p fish-cli --bin Fish -- --version
