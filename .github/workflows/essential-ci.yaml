name: Essential CI

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  critical-crates:
    name: Critical Crates Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p fish-core -p fish-scheduler -p fish-cache -p fish-cas -p fish-executor --lib

  critical-quality:
    name: Critical Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Check clippy
        run: cargo clippy -p fish-core -p fish-scheduler -p fish-cache -p fish-cas -p fish-executor -- -D warnings

  essential-status:
    name: Essential CI Status
    runs-on: ubuntu-latest
    needs: [critical-crates, critical-quality]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.critical-crates.result }}" != "success" ] || \
             [ "${{ needs.critical-quality.result }}" != "success" ]; then
            echo "Essential CI Failed"
            exit 1
          fi
          echo "Essential CI Passed"