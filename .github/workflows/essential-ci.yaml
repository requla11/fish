name: Essential CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  critical-crates:
    name: Critical Crates Testing
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p fish-core -p fish-scheduler -p fish-cache -p fish-cas -p fish-executor --lib

  critical-quality:
    name: Critical Quality Checks
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Check clippy
        run: cargo clippy -p fish-core -p fish-scheduler -p fish-cache -p fish-cas -p fish-executor -- -D warnings

  essential-status:
    name: Essential CI Status
    runs-on: ubuntu-latest
    needs: [critical-crates, critical-quality]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.critical-crates.result }}" = "failure" ] || \
             [ "${{ needs.critical-quality.result }}" = "failure" ]; then
            echo "Essential CI Failed"
            exit 1
          fi
          echo "Essential CI Passed or skipped"