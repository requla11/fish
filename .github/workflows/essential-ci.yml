name: Essential CI

on:
  push:
    branches: [ main, develop, dev ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  critical-quality-checks:
    name: Critical Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-critical-quality-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy on workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::result_large_err
      
      - name: Check documentation
        run: cargo doc --workspace --no-deps --all-features

  critical-crates:
    name: Critical Crates Testing
    runs-on: ubuntu-latest
    needs: critical-quality-checks
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-critical-build-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Test critical crates
        run: cargo test -p forge-core -p forge-graph -p forge-executor -p forge-scheduler -p forge-cache -p forge-cas
      
      - name: Build workspace release
        run: cargo build --workspace --release

  essential-status:
    name: Essential CI Status
    runs-on: ubuntu-latest
    needs: [critical-quality-checks, critical-crates]
    if: always()
    steps:
      - name: Check essential CI status
        run: |
          echo "Quality Checks: ${{ needs.critical-quality-checks.result }}"
          echo "Critical Crates: ${{ needs.critical-crates.result }}"
          
          if [ "${{ needs.critical-quality-checks.result }}" != "success" ] || \
             [ "${{ needs.critical-crates.result }}" != "success" ]; then
            echo "Essential CI Failed"
            exit 1
          else
            echo "Essential CI Passed"
          fi