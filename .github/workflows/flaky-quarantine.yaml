name: Flaky Test Detection & Stress Testing

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  flaky-stress-test:
    name: Flaky Test Stress Run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stress Test Iterations
        run: |
          for i in {1..5}; do
            echo "Running test iteration $i of 5..."
            cargo test -p fish-executor -p fish-scheduler -p fish-cache -- --test-threads=4
          done
          echo "All stress test iterations passed without flakiness."
