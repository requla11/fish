# Auto-generated by forge ci init
# 
# This workflow is optimized based on your build graph:
# - Parallel execution where possible
# - Cache configuration enabled
# - Artifact sharing between jobs
# - Remote cache support if configured

name: Forge CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORGE_CACHE_ENABLED: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Forge
        run: |
          curl -L https://github.com/your-org/forge/releases/latest/download/forge-linux -o forge
          chmod +x forge
          sudo mv forge /usr/local/bin/
      
      - name: Cache Forge artifacts
        uses: actions/cache@v4
        with:
          path: ~/.forge/cache
          key: forge-cache-build
          restore-keys: forge-cache-
      
      - name: Build build
        run: |
          cargo build --release
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/release/my_app
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ["build"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Forge
        run: |
          curl -L https://github.com/your-org/forge/releases/latest/download/forge-linux -o forge
          chmod +x forge
          sudo mv forge /usr/local/bin/
      
      - name: Cache Forge artifacts
        uses: actions/cache@v4
        with:
          path: ~/.forge/cache
          key: forge-cache-test
          restore-keys: forge-cache-
      
      - name: Build test
        run: |
          cargo test
      

