name: Integration Testing

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  core-integration:
    name: Core & CLI Integration Tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p fish-core --test project
      - name: Run CLI Integration Tests
        run: cargo test -p fish-cli --test build --test init_and_new

  subsystems-integration:
    name: Subsystems Integration Tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Remote Cache Tests
        run: cargo test -p fish-remote-cache --lib
      - name: Run Worker Integration Tests
        run: cargo test -p fish-worker --test remote_exec

  integration-summary:
    name: Integration Summary
    runs-on: ubuntu-latest
    needs: [core-integration, subsystems-integration]
    if: always()
    steps:
      - name: Check Status
        run: |
          if [ "${{ needs.core-integration.result }}" = "failure" ] || \
             [ "${{ needs.subsystems-integration.result }}" = "failure" ]; then
            echo "Integration Tests Failed"
            exit 1
          fi
          echo "All Integration Tests Passed or skipped"