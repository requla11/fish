name: Integration Testing

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-integration:
    name: Core & CLI Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p forge-core --test project
      - name: Run CLI Integration Tests
        run: cargo test -p forge-cli --test build --test init_and_new

  subsystems-integration:
    name: Subsystems Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Remote Cache Tests
        run: cargo test -p forge-remote-cache --lib
      - name: Run Worker Integration Tests
        run: cargo test -p forge-worker --test remote_exec

  integration-summary:
    name: Integration Summary
    runs-on: ubuntu-latest
    needs: [core-integration, subsystems-integration]
    if: always()
    steps:
      - name: Check Status
        run: |
          if [ "${{ needs.core-integration.result }}" != "success" ] || \
             [ "${{ needs.subsystems-integration.result }}" != "success" ]; then
            echo "Integration Tests Failed"
            exit 1
          fi
          echo "All Integration Tests Passed"