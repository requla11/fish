name: Multi-Platform Testing

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: Test Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p fish-core -p fish-cache -p fish-scheduler -p fish-executor --lib

  test-macos:
    name: Test macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p fish-core -p fish-cache -p fish-remote-cache --lib

  test-windows:
    name: Test Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p fish-core -p fish-cache -p fish-scheduler --lib

  platform-summary:
    name: Platform Summary
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos, test-windows]
    if: always()
    steps:
      - name: Check Status
        run: |
          if [ "${{ needs.test-linux.result }}" != "success" ] || \
             [ "${{ needs.test-macos.result }}" != "success" ] || \
             [ "${{ needs.test-windows.result }}" != "success" ]; then
            echo "Platform Tests Failed"
            exit 1
          fi
          echo "All Platform Tests Passed"