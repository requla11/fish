name: Multi-Platform Testing

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  test-linux:
    name: Test Linux
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p fish-core -p fish-cache -p fish-scheduler -p fish-executor --lib

  test-macos:
    name: Test macOS
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p fish-core -p fish-cache -p fish-remote-cache --lib

  test-windows:
    name: Test Windows
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p fish-core -p fish-cache -p fish-scheduler --lib

  platform-summary:
    name: Platform Summary
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos, test-windows]
    if: always()
    steps:
      - name: Check Status
        run: |
          if [ "${{ needs.test-linux.result }}" = "failure" ] || \
             [ "${{ needs.test-macos.result }}" = "failure" ] || \
             [ "${{ needs.test-windows.result }}" = "failure" ]; then
            echo "Platform Tests Failed"
            exit 1
          fi
          echo "All Platform Tests Passed or skipped"