name: Multi-Platform Testing

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: Test Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p forge-core -p forge-cache -p forge-scheduler -p forge-executor --lib

  test-macos:
    name: Test macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p forge-core -p forge-cache -p forge-remote-cache --lib

  test-windows:
    name: Test Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p forge-core -p forge-cache -p forge-scheduler --lib

  platform-summary:
    name: Platform Summary
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos, test-windows]
    if: always()
    steps:
      - name: Check Status
        run: |
          if [ "${{ needs.test-linux.result }}" != "success" ] || \
             [ "${{ needs.test-macos.result }}" != "success" ] || \
             [ "${{ needs.test-windows.result }}" != "success" ]; then
            echo "Platform Tests Failed"
            exit 1
          fi
          echo "All Platform Tests Passed"