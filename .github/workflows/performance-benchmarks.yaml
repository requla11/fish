name: Performance Benchmarks

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  cache-benchmarks:
    name: Cache Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run cache benchmarks
        run: cargo bench -p fish-cache
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion
          if-no-files-found: ignore

  scheduler-benchmarks:
    name: Scheduler Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run scheduler benchmarks
        run: cargo test -p fish-scheduler --release -- --nocapture

  concurrent-performance:
    name: Concurrent Performance Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run concurrent executor benchmarks
        run: cargo test -p fish-executor --release -- --nocapture

  benchmark-summary:
    name: Benchmark Summary
    runs-on: ubuntu-latest
    needs: [cache-benchmarks, scheduler-benchmarks, concurrent-performance]
    if: always()
    steps:
      - name: Check benchmark results
        run: |
          if [ "${{ needs.cache-benchmarks.result }}" != "success" ] || \
             [ "${{ needs.scheduler-benchmarks.result }}" != "success" ] || \
             [ "${{ needs.concurrent-performance.result }}" != "success" ]; then
            echo "Benchmarks Failed"
            exit 1
          fi
          echo "All Benchmarks Passed"