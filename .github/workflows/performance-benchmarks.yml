name: Performance Benchmarks & Regression Alerts

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  benchmark:
    name: Continuous Benchmarking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo Benchmarks
        run: |
          cargo bench -p fish-graph -- --output-format bencher | tee graph_bench.txt || true
          cargo bench -p fish-cas -- --output-format bencher | tee cas_bench.txt || true

      - name: Continuous Benchmark Tracking
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Fish Engine Performance Benchmarks
          tool: 'cargo'
          output-file-path: graph_bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: true
          summary-always: true
