name: PR Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  pr-title:
    name: Semantic PR Title Check
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  prohibited-files:
    name: Prohibited & Binary Files Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for prohibited file extensions
        run: |
          MODIFIED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          echo "Checking modified files: $MODIFIED_FILES"
          
          DISALLOWED_PATTERNS="\.exe$|\.dll$|\.so$|\.dylib$|\.pdb$|\.tar\.gz$|\.zip$|\.env|\.pem$|\.key$|id_rsa"
          
          FOUND_BLOCKED=$(echo "$MODIFIED_FILES" | grep -E "$DISALLOWED_PATTERNS" || true)
          
          if [ -n "$FOUND_BLOCKED" ]; then
            echo "Error: The following blocked/binary files were detected in PR:"
            echo "$FOUND_BLOCKED"
            exit 1
          else
            echo "No blocked or large binary files detected."
          fi

  lockfile-check:
    name: Cargo Lockfile Synchronization Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Verify Cargo.lock matches Cargo.toml
        run: cargo check --workspace --locked
