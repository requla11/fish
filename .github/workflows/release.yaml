name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross compilation tools
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build Release Binary (Native)
        if: "!matrix.use_cross"
        run: cargo build -p fish-cli --release --target ${{ matrix.target }}

      - name: Build Release Binary (Cross)
        if: matrix.use_cross
        run: cross build -p fish-cli --release --target ${{ matrix.target }}

      - name: Package Binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          BIN_NAME="fish"
          PKG_NAME="fish-${{ github.ref_name || github.event.inputs.tag || 'pr' }}-${{ matrix.target }}"
          mkdir -p "$PKG_NAME"
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "$PKG_NAME/"
          cp README.md LICENSE "$PKG_NAME/" 2>/dev/null || true
          tar -czf "$PKG_NAME.tar.gz" "$PKG_NAME"
          echo "ARCHIVE=$PKG_NAME.tar.gz" >> $GITHUB_ENV

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          BIN_NAME="fish.exe"
          PKG_NAME="fish-${{ github.ref_name || github.event.inputs.tag || 'pr' }}-${{ matrix.target }}"
          mkdir -p "$PKG_NAME"
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "$PKG_NAME/"
          cp README.md LICENSE "$PKG_NAME/" 2>/dev/null || true
          7z a "$PKG_NAME.zip" "$PKG_NAME"
          echo "ARCHIVE=$PKG_NAME.zip" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums & SBOM
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
