name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.5.0)"
        required: true

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-artifacts:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation toolchain (macOS x86_64 on arm64 runner)
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p fish-cli

      - name: Stage artifacts (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="fish-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/fish" "dist/${STAGE}/fish"
          cp README.md LICENSE "dist/${STAGE}/" 2>/dev/null || true
          tar czf "dist/${STAGE}.tar.gz" -C dist "${STAGE}"
          sha256sum "dist/${STAGE}.tar.gz" > "dist/${STAGE}.tar.gz.sha256"

      - name: Stage artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $stage = "fish-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist\$stage" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\fish.exe" "dist\$stage\fish.exe"
          Compress-Archive -Path "dist\$stage" -DestinationPath "dist\$stage.zip"
          $hash = (Get-FileHash "dist\$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Out-File -Encoding ascii "dist\$stage.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: fish-${{ matrix.target }}
          path: dist/*

  generate-provenance:
    name: SLSA Provenance + Ed25519 Signature
    needs: build-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate in-toto Statement/v1 per artifact
        shell: bash
        run: |
          mkdir -p provenance
          for f in dist/*.tar.gz dist/*.zip; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            cat > "provenance/${name}.intoto.jsonl" <<EOF
          {"_type":"https://in-toto.io/Statement/v1","subject":[{"name":"${name}","digest":{"sha256":"${sha}"}}],"predicateType":"https://slsa.dev/provenance/v1","predicate":{"buildDefinition":{"externalParameters":{"workflow":"release.yaml","ref":"${GITHUB_REF_NAME}"},"internalParameters":{},"resolvedDependencies":[]},"runDetails":{"builder":{"id":"https://github.com/actions/runner"},"metadata":{"invocationId":"${{ github.run_id }}"}}}}
          EOF
          done
          ls -la provenance/

      - name: Sign provenance statements with Ed25519
        env:
          FISH_SIGNING_SEED: ${{ secrets.RELEASE_SIGNING_SEED }}
        shell: bash
        run: |
          # Deterministic signing via the fish CLI itself.
          cargo run --quiet -p fish-cli -- attest sign-provenance \
            --dir provenance --out-dir provenance-signed || \
            echo "::warning::attest subcommand unavailable; publishing unsigned"

      - uses: actions/upload-artifact@v4
        with:
          name: provenance
          path: provenance*/

  create-release:
    name: Create GitHub Release
    needs: [build-artifacts, generate-provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums file
        shell: bash
        run: cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS 2>/dev/null || sha256sum *.* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') && !contains(github.ref_name, '.') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS
            provenance-signed/*
