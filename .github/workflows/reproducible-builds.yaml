name: Reproducible Builds & SBOM

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sbom-generation:
    name: Generate Software Bill of Materials (SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@cargo-cyclonedx
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --all
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: "*.cdx.json"
          if-no-files-found: ignore

  deterministic-build:
    name: Deterministic Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: First build pass
        run: |
          cargo build --release -p fish-cli
          sha256sum target/release/fish > build1.sha256
      - name: Clean intermediate artifacts
        run: cargo clean -p fish-cli
      - name: Second build pass
        run: |
          cargo build --release -p fish-cli
          sha256sum target/release/fish > build2.sha256
      - name: Verify reproducibility hash
        run: |
          echo "Comparing build artifact hashes:"
          diff -u build1.sha256 build2.sha256
