name: Security Audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Run cargo audit
        run: cargo audit
      - name: Run cargo-deny
        run: cargo deny check licenses bans sources

  security-features:
    name: Security Features Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: security-features
      - name: Test security modules
        run: cargo test -p fish-security --lib

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache Gitleaks Binary
        id: cache-gitleaks
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/gitleaks
          key: gitleaks-8.18.4-linux-x64
      - name: Download and Install Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
      - name: Run Gitleaks
        run: gitleaks detect --verbose --redact --no-banner

  security-docs:
    name: Security Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for security documentation
        run: |
          if [ ! -f "SECURITY.md" ]; then
            echo "SECURITY.md not found"
            exit 1
          fi
          echo "SECURITY.md exists"

  memory-safety:
    name: Memory Safety Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for unsafe code blocks
        run: |
          echo "Checking for unsafe code blocks"
          grep -r "unsafe" crates/ --include="*.rs" | grep -v "forbid(unsafe_code)" || true

  security-report:
    name: Security Compliance Report
    runs-on: ubuntu-latest
    needs: [dependency-audit, security-features, codeql, secret-scan, security-docs]
    if: always()
    steps:
      - name: Generate security report
        run: |
          echo "# Security Compliance Report" > security-report.md
          echo "" >> security-report.md
          echo "Dependency Audit: ${{ needs.dependency-audit.result }}" >> security-report.md
          echo "Security Features: ${{ needs.security-features.result }}" >> security-report.md
          echo "CodeQL Analysis: ${{ needs.codeql.result }}" >> security-report.md
          echo "Secret Scan: ${{ needs.secret-scan.result }}" >> security-report.md
          echo "Security Docs: ${{ needs.security-docs.result }}" >> security-report.md
          cat security-report.md
          
          if [ "${{ needs.dependency-audit.result }}" != "success" ] || \
             [ "${{ needs.security-features.result }}" != "success" ] || \
             [ "${{ needs.codeql.result }}" != "success" ] || \
             [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.security-docs.result }}" != "success" ]; then
            echo "Security Audit Failed"
            exit 1
          fi