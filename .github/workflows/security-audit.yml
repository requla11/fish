name: Security Audit

on:
  push:
    branches: [ main, develop, dev ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      
      - name: Run cargo audit
        run: cargo audit
      
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  security-features:
    name: Security Features Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Test signing module
        run: cargo test -p forge-signing --lib
      
      - name: Test security module
        run: cargo test -p forge-security --lib
      
      - name: Test secrets module
        run: cargo test -p forge-secrets --lib

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Gitleaks
        uses: taiki-e/install-action@v2
        with:
          tool: gitleaks
      
      - name: Run Gitleaks
        run: gitleaks detect --verbose --redact --no-banner

  security-docs:
    name: Security Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for security documentation
        run: |
          if [ ! -f "SECURITY.md" ]; then
            echo "SECURITY.md not found"
            exit 1
          fi
          echo "SECURITY.md exists"

  memory-safety:
    name: Memory Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Nightly Rust toolchain with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      
      - name: Check for unsafe code blocks
        run: |
          echo "Checking for unsafe code blocks"
          grep -r "unsafe" crates/ --include="*.rs" | grep -v "forbid(unsafe_code)" || true
      
      - name: Run Miri for undefined behavior
        run: cargo miri test -p forge-core -p forge-cache -p forge-executor
        continue-on-error: true

  security-report:
    name: Security Compliance Report
    runs-on: ubuntu-latest
    needs: [dependency-audit, security-features, codeql, secret-scan, security-docs]
    if: always()
    steps:
      - name: Generate security report
        run: |
          echo "# Security Compliance Report" > security-report.md
          echo "" >> security-report.md
          echo "Dependency Audit: ${{ needs.dependency-audit.result }}" >> security-report.md
          echo "Security Features: ${{ needs.security-features.result }}" >> security-report.md
          echo "CodeQL Analysis: ${{ needs.codeql.result }}" >> security-report.md
          echo "Secret Scan: ${{ needs.secret-scan.result }}" >> security-report.md
          echo "Security Docs: ${{ needs.security-docs.result }}" >> security-report.md
          cat security-report.md
          
          if [ "${{ needs.dependency-audit.result }}" != "success" ] || \
             [ "${{ needs.security-features.result }}" != "success" ] || \
             [ "${{ needs.codeql.result }}" != "success" ] || \
             [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.security-docs.result }}" != "success" ]; then
            echo "Security Audit Failed"
            exit 1
          fi
      
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md