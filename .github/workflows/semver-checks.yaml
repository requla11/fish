name: SemVer Compatibility Checks

on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'crates/fish-core/**'
      - 'crates/fish-cache/**'
      - 'crates/fish-executor/**'
      - 'crates/fish-scheduler/**'
      - 'crates/fish-cas/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  semver-checks:
    name: Public API SemVer Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      - name: Check fish-core SemVer
        run: cargo semver-checks check-release -p fish-core --baseline-root . || true

      - name: Check fish-cache SemVer
        run: cargo semver-checks check-release -p fish-cache --baseline-root . || true

      - name: Check fish-executor SemVer
        run: cargo semver-checks check-release -p fish-executor --baseline-root . || true

      - name: Check fish-scheduler SemVer
        run: cargo semver-checks check-release -p fish-scheduler --baseline-root . || true
