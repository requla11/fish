[workspace]
resolver = "2"
members = [
    "crates/fish-backend-api",
    "crates/fish-core",
    "crates/fish-graph",
    "crates/fish-executor",
    "crates/fish-scheduler",
    "crates/fish-cache",
    "crates/fish-cas",
    "crates/fish-ci-generator",
    "crates/fish-backend-rust",
    "crates/fish-backend-cc",
    "crates/fish-backend-go",
    "crates/fish-backend-ts",
    "crates/fish-backend-py",
    "crates/fish-backend-java",
    "crates/fish-backend-dotnet",
    "crates/fish-backend-swift",
    "crates/fish-backend-dart",
    "crates/fish-backend-zig",
    "crates/fish-backend-docker",
    "crates/fish-worker",
    "crates/fish-plugin",
    "crates/fish-remote-cache",
    "crates/fish-sandbox",
    "crates/fish-security",
    "crates/fish-analytics",
    "crates/fish-incremental",
    "crates/fish-cli",
    "crates/fish-installer",
    "submodules/apple",
    "submodules/banana",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/requla11/fish"
description = "Fish is a fast, flexible, cache-first build orchestration system for Rust and beyond."
homepage = "https://github.com/requla11/fish"
documentation = "https://github.com/requla11/fish/tree/main/docs"
readme = "README.md"
authors = ["Fish Contributors"]
keywords = ["build", "cache", "orchestration", "monorepo", "ci"]
categories = ["development-tools", "development-tools::build-utils"]

[workspace.dependencies]
anyhow = "1.0"
apple = { path = "submodules/apple", version = "0.1.0" }
fish-backend-api = { path = "crates/fish-backend-api", version = "0.6.0" }
fish-core = { path = "crates/fish-core", version = "0.6.0" }
fish-graph = { path = "crates/fish-graph", version = "0.6.0" }
fish-executor = { path = "crates/fish-executor", version = "0.6.0" }
fish-scheduler = { path = "crates/fish-scheduler", version = "0.6.0" }
fish-cache = { path = "crates/fish-cache", version = "0.6.0" }
fish-cas = { path = "crates/fish-cas", version = "0.6.0" }
fish-ci-generator = { path = "crates/fish-ci-generator", version = "0.6.0" }
fish-backend-rust = { path = "crates/fish-backend-rust", version = "0.6.0" }
fish-backend-cc = { path = "crates/fish-backend-cc", version = "0.6.0" }
fish-backend-go = { path = "crates/fish-backend-go", version = "0.6.0" }
fish-backend-ts = { path = "crates/fish-backend-ts", version = "0.6.0" }
fish-backend-py = { path = "crates/fish-backend-py", version = "0.6.0" }
fish-backend-java = { path = "crates/fish-backend-java", version = "0.6.0" }
fish-backend-dotnet = { path = "crates/fish-backend-dotnet", version = "0.6.0" }
fish-backend-swift = { path = "crates/fish-backend-swift", version = "0.6.0" }
fish-backend-dart = { path = "crates/fish-backend-dart", version = "0.6.0" }
fish-backend-zig = { path = "crates/fish-backend-zig", version = "0.6.0" }
fish-backend-docker = { path = "crates/fish-backend-docker", version = "0.6.0" }
fish-worker = { path = "crates/fish-worker", version = "0.6.0" }
fish-plugin = { path = "crates/fish-plugin", version = "0.6.0" }
fish-remote-cache = { path = "crates/fish-remote-cache", version = "0.6.0" }
fish-sandbox = { path = "crates/fish-sandbox", version = "0.6.0" }
fish-security = { path = "crates/fish-security", version = "0.6.0" }
fish-analytics = { path = "crates/fish-analytics", version = "0.6.0" }
fish-incremental = { path = "crates/fish-incremental", version = "0.6.0" }

cargo_metadata = "0.23"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
spin = "0.12"
tempfile = "3"
regex = "1"
blake3 = "1"

clap = { version = "4.5", features = ["derive"] }
anstream = "1.0"
anstyle = "1.0"
notify = "8"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
tracing-appender = "0.2"
tracing-chrome = "0.7"
tracing-flame = "0.2"

uuid = { version = "1.10", features = ["v4", "serde"] }
walkdir = "2"
glob = "0.3"
wait-timeout = "0.2"

base64 = "0.23"
sha2 = "0.11"
ed25519 = "3.0"
ed25519-dalek = "3.0"
rand = "0.10"
rand_core = "0.10"
chrono = { version = "0.4", features = ["serde"] }
spdx = "0.13"
cyclonedx-bom = "0.8"
serde_bytes = "0.11"
fastrand = "2.5"
handlebars = "6"
memmap2 = "0.9"
tar = "0.4"
zstd = "0.13"
dashmap = { version = "6", features = ["rayon", "serde"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
bollard = "0.21"
criterion = { version = "0.8", features = ["html_reports"] }

[workspace.metadata.tarpaulin]
# Test coverage configuration
out = ["Html", "Xml"]
run-types = ["Tests", "Binaries"]
branch-coverage = true
line-coverage = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
unused_mut = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"
complexity = "warn"
correctness = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
indexing_slicing = "warn"

[profile.dev]
opt-level = 1
debug = 2
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
split-debuginfo = "off"

[profile.bench]
inherits = "release"
debug = true
lto = "fat"
codegen-units = 1
