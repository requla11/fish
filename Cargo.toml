[workspace]
resolver = "2"
members = [
    "crates/fish-core",
    "crates/fish-graph",
    "crates/fish-executor",
    "crates/fish-scheduler",
    "crates/fish-cache",
    "crates/fish-cas",
    "crates/fish-ci-generator",
    "crates/fish-backend-rust",
    "crates/fish-backend-cc",
    "crates/fish-backend-go",
    "crates/fish-backend-ts",
    "crates/fish-backend-py",
    "crates/fish-backend-java",
    "crates/fish-backend-dotnet",
    "crates/fish-backend-swift",
    "crates/fish-backend-dart",
    "crates/fish-backend-zig",
    "crates/fish-backend-docker",
    "crates/fish-worker",
    "crates/fish-plugin",
    "crates/fish-remote-cache",
    "crates/fish-sandbox",
    "crates/fish-signing",
    "crates/fish-security",
    "crates/fish-analytics",
    "crates/fish-multiplatform",
    "crates/fish-notifications",
    "crates/fish-flaky-detection",
    "crates/fish-docker-builder",
    "crates/fish-secrets",
    "crates/fish-incremental",
    "crates/fish-templates",
    "crates/fish-cli",
    "crates/fish-installer",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/requla11/fish"
description = "Fish is a fast, flexible, cache-first build orchestration system for Rust and beyond."

[workspace.dependencies]
anyhow = "1.0"
fish-core = { path = "crates/fish-core", version = "0.3.0" }
fish-graph = { path = "crates/fish-graph", version = "0.3.0" }
fish-executor = { path = "crates/fish-executor", version = "0.3.0" }
fish-scheduler = { path = "crates/fish-scheduler", version = "0.3.0" }
fish-cache = { path = "crates/fish-cache", version = "0.3.0" }
fish-cas = { path = "crates/fish-cas", version = "0.3.0" }
fish-ci-generator = { path = "crates/fish-ci-generator", version = "0.3.0" }
fish-backend-rust = { path = "crates/fish-backend-rust", version = "0.3.0" }
fish-backend-cc = { path = "crates/fish-backend-cc", version = "0.3.0" }
fish-backend-go = { path = "crates/fish-backend-go", version = "0.3.0" }
fish-backend-ts = { path = "crates/fish-backend-ts", version = "0.3.0" }
fish-backend-py = { path = "crates/fish-backend-py", version = "0.3.0" }
fish-backend-java = { path = "crates/fish-backend-java", version = "0.3.0" }
fish-backend-dotnet = { path = "crates/fish-backend-dotnet", version = "0.3.0" }
fish-backend-swift = { path = "crates/fish-backend-swift", version = "0.3.0" }
fish-backend-dart = { path = "crates/fish-backend-dart", version = "0.3.0" }
fish-backend-zig = { path = "crates/fish-backend-zig", version = "0.3.0" }
fish-backend-docker = { path = "crates/fish-backend-docker", version = "0.3.0" }
fish-worker = { path = "crates/fish-worker", version = "0.3.0" }
fish-plugin = { path = "crates/fish-plugin", version = "0.3.0" }
fish-remote-cache = { path = "crates/fish-remote-cache", version = "0.3.0" }
fish-sandbox = { path = "crates/fish-sandbox", version = "0.3.0" }
fish-signing = { path = "crates/fish-signing", version = "0.3.0" }
fish-security = { path = "crates/fish-security", version = "0.3.0" }
fish-analytics = { path = "crates/fish-analytics", version = "0.3.0" }
fish-multiplatform = { path = "crates/fish-multiplatform", version = "0.3.0" }
fish-notifications = { path = "crates/fish-notifications", version = "0.3.0" }
fish-flaky-detection = { path = "crates/fish-flaky-detection", version = "0.3.0" }
fish-docker-builder = { path = "crates/fish-docker-builder", version = "0.3.0" }
fish-secrets = { path = "crates/fish-secrets", version = "0.3.0" }
fish-incremental = { path = "crates/fish-incremental", version = "0.3.0" }
fish-templates = { path = "crates/fish-templates", version = "0.3.0" }

cargo_metadata = "0.23"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
spin = "0.12"
tempfile = "3"
regex = "1"
blake3 = "1"

clap = { version = "4.5", features = ["derive"] }
anstream = "1.0"
anstyle = "1.0"
notify = "8"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
async-trait = "0.1"
