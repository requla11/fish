[package]
name = "apple"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Offline fallback shim for the private apple sandbox daemon (see submodules/apple). Provides the minimal API used by fish-sandbox so the workspace builds without network access."
repository = "https://github.com/requla11/fish"
keywords = ["build", "sandbox", "shim"]
categories = ["development-tools"]
readme = "../../README.md"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["process", "macros", "rt"] }

[lints]
workspace = true
