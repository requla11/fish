[package]
name = "fish-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Content-addressed task fingerprint cache for the Fish build tool"

[dependencies]
anyhow = { workspace = true }
fish-executor = { workspace = true }
fish-cas = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "sync"] }
spin = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
memmap2 = { workspace = true }

[features]
io-uring = ["dep:tokio-uring"]

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
criterion = { workspace = true }

[[bench]]
name = "cache_performance"
harness = false

[[bench]]
name = "simple_profiling"
harness = false

[[bench]]
name = "string_pool_bench"
harness = false
