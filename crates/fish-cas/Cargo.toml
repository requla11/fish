[package]
name = "fish-cas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Content-Addressable Storage for build artifacts with compression and remote backends"

[dependencies]
blake3 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread"] }
async-trait = { workspace = true }
chrono = { workspace = true }
zstd = { workspace = true, features = ["zstdmt"] }
tame-gcs = { version = "0.14", optional = true }
reqwest = { version = "0.13", features = ["json"], optional = true }
memmap2 = { workspace = true }

[features]
default = ["local"]
local = []
gcs = ["tame-gcs"]
remote = ["reqwest"]
full = ["local", "gcs", "remote"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
criterion = { workspace = true }

[[bench]]
name = "cas_performance"
harness = false
