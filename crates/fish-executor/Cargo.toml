[package]
name = "fish-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Task model and process execution for the Fish build tool"

[dependencies]
thiserror = { workspace = true }
wait-timeout = "0.2"
fastrand = "2.5"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "time", "macros", "rt"] }

[dev-dependencies]
tempfile = "3"
