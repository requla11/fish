[package]
name = "fish-flaky-detection"
version = "0.3.0"
edition = "2024"
authors = ["Foursavage Dev <foursavage@proton.me>"]
license = "MIT"
repository = "https://github.com/requla11/fish"
description = "Flaky test detection and auto-retry for Fish"
keywords = ["flaky", "tests", "retry", "detection"]
categories = ["development-tools"]

[dependencies]
anyhow = { workspace = true }
fish-core = { path = "../fish-core" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }

