[package]
name = "fish-incremental"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Incremental build analysis for Fish"
keywords = ["incremental", "analysis", "build", "optimization"]
categories = ["development-tools"]

[dependencies]
fish-core = { path = "../fish-core" }
fish-graph = { path = "../fish-graph" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
syn = { version = "3.0.5", features = ["full", "visit"] }
quote = "1.0.47"

[dev-dependencies]
tempfile = { workspace = true }

