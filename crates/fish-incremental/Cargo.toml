[package]
name = "fish-incremental"
version = "0.3.0"
edition = "2024"
authors = ["Foursavage Dev <foursavage@proton.me>"]
license = "MIT"
repository = "https://github.com/requla11/fish"
description = "Incremental build analysis for Fish"
keywords = ["incremental", "analysis", "build", "optimization"]
categories = ["development-tools"]

[dependencies]
fish-core = { path = "../fish-core" }
fish-graph = { path = "../fish-graph" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"

[dev-dependencies]
tempfile = { workspace = true }

