[package]
name = "fish-secrets"
version = "0.2.0"
edition = "2024"
authors = ["Foursavage Dev <foursavage@proton.me>"]
license = "MIT"
repository = "https://github.com/foursavage-dev/fish-rs"
description = "Secret management integration for Fish"
keywords = ["secrets", "vault", "security", "credentials"]
categories = ["development-tools"]

[dependencies]
anyhow = { workspace = true }
fish-core = { path = "../fish-core" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
