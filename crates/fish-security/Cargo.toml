[package]
name = "fish-security"
version = "0.2.0"
edition = "2024"
authors = ["Foursavage Dev <foursavage@proton.me>"]
license = "MIT"
repository = "https://github.com/requla11/fish"
description = "Dependency vulnerability scanner for Fish"
keywords = ["security", "vulnerability", "scanner", "audit"]
categories = ["development-tools"]

[dependencies]
fish-core = { path = "../fish-core" }

thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
semver = "1.0"

[dev-dependencies]
tempfile = "3.10"
