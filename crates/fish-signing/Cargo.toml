[package]
name = "fish-signing"
version = "0.3.0"
edition = "2024"
authors = ["Foursavage Dev <foursavage@proton.me>"]
license = "MIT"
repository = "https://github.com/requla11/fish"
description = "Build artifact signing and verification for Fish"
keywords = ["signing", "verification", "security", "sbom"]
categories = ["development-tools"]

[dependencies]
fish-core = { path = "../fish-core" }
fish-cas = { path = "../fish-cas" }

thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
base64 = "0.23"
sha2 = "0.11"
ed25519 = "3.0"
ed25519-dalek = "3.0"
rand = "0.10"
rand_core = "0.10"
chrono = { version = "0.4", features = ["serde"] }
spdx = "0.13"
cyclonedx-bom = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
serde_bytes = "0.11"

[dev-dependencies]
tempfile = "3.10"

