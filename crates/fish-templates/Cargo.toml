[package]
name = "fish-templates"
version = "0.3.0"
edition = "2024"
authors = ["Foursavage Dev <foursavage@proton.me>"]
license = "MIT"
repository = "https://github.com/requla11/fish"
description = "Build pipeline templates for Fish"
keywords = ["templates", "pipelines", "workflows", "reusable"]
categories = ["development-tools"]

[dependencies]
anyhow = { workspace = true }
fish-core = { path = "../fish-core" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
handlebars = "6.0"

