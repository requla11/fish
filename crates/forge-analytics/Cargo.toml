[package]
name = "forge-analytics"
version = "0.2.0"
edition = "2024"
authors = ["Foursavage Dev <foursavage@proton.me>"]
license = "MIT"
repository = "https://github.com/foursavage-dev/forge-rs"
description = "Build cache analytics dashboard for Forge"
keywords = ["analytics", "dashboard", "cache", "metrics"]
categories = ["development-tools"]

[dependencies]
anyhow = { workspace = true }
forge-core = { path = "../forge-core" }
forge-cache = { path = "../forge-cache" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
