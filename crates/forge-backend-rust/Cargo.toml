[package]
name = "forge-backend-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust/Cargo backend for the forge build tool"

[dependencies]
blake3 = "1"
cargo_metadata = { workspace = true }
forge-core = { path = "../forge-core" }
forge-executor = { path = "../forge-executor" }
forge-graph = { path = "../forge-graph" }
thiserror = { workspace = true }

[dev-dependencies]
forge-cache = { path = "../forge-cache" }
forge-scheduler = { path = "../forge-scheduler" }
tempfile = "3"