[package]
name = "forge-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Content-addressed task fingerprint cache for the forge build tool"

[dependencies]
forge-executor = { path = "../forge-executor" }
forge-cas = { path = "../forge-cas" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "sync"] }
spin = { workspace = true }
dashmap = { version = "6", features = ["rayon", "serde"] }
parking_lot = { version = "0.12" }
crossbeam-channel = { version = "0.5" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "cache_performance"
harness = false

[[bench]]
name = "simple_profiling"
harness = false