[package]
name = "forge-cas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Content-Addressable Storage for build artifacts with compression and remote backends"

[dependencies]
blake3 = "1"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["fs", "io-util"] }
async-trait = "0.1"
chrono = "0.4"
# Compression
zstd = "0.13"
# Optional GCS support
tame-gcs = { version = "0.11", optional = true }
# HTTP client for remote operations
reqwest = { version = "0.12", features = ["json"], optional = true }

[features]
default = ["local"]
local = []
gcs = ["tame-gcs"]
remote = ["reqwest"]
full = ["local", "gcs", "remote"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
