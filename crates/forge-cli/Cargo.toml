[package]
name = "forge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Forge command-line interface"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-core = { workspace = true }
forge-graph = { workspace = true }
forge-executor = { workspace = true }
forge-scheduler = { workspace = true }
forge-cache = { workspace = true }
forge-cas = { workspace = true }
forge-ci-generator = { workspace = true }
forge-backend-rust = { workspace = true }
forge-backend-cc = { workspace = true }
forge-backend-go = { workspace = true }
forge-backend-ts = { workspace = true }
forge-backend-py = { workspace = true }
forge-backend-java = { workspace = true }
forge-backend-dotnet = { workspace = true }
forge-backend-swift = { workspace = true }
forge-backend-dart = { workspace = true }
forge-backend-zig = { workspace = true }
forge-backend-docker = { workspace = true }
forge-worker = { workspace = true }
forge-remote-cache = { workspace = true }
forge-plugin = { workspace = true }
forge-sandbox = { workspace = true }
cargo_metadata = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
spin = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
wait-timeout = "0.2"

clap = { workspace = true }
anstream = { workspace = true }
anstyle = { workspace = true }
notify = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
blake3 = "1"

[dev-dependencies]
tempfile = { workspace = true }