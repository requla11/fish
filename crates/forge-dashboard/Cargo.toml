[package]
name = "forge-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Interactive web dashboard for forge build system with flamegraph visualization"

[dependencies]
forge-core = { workspace = true }
forge-graph = { workspace = true }
forge-cache = { workspace = true }
forge-cas = { workspace = true }
forge-executor = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
