<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Build Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        
        h1 {
            font-size: 28px;
            color: #4CAF50;
        }
        
        .status {
            display: flex;
            gap: 20px;
        }
        
        .status-item {
            background: #16213e;
            padding: 10px 20px;
            border-radius: 8px;
        }
        
        .status-value {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .status-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        .builds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .build-card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .build-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .build-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .build-id {
            font-weight: bold;
            color: #4CAF50;
        }
        
        .build-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-success {
            background: #4CAF50;
            color: white;
        }
        
        .status-failed {
            background: #f44336;
            color: white;
        }
        
        .status-running {
            background: #2196F3;
            color: white;
        }
        
        .build-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
        }
        
        .info-label {
            color: #888;
        }
        
        .info-value {
            color: #eee;
        }
        
        .build-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .btn-primary {
            background: #4CAF50;
            color: white;
        }
        
        .btn-primary:hover {
            background: #45a049;
        }
        
        .btn-secondary {
            background: #333;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #444;
        }
        
        .flamegraph-container {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .flamegraph-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #4CAF50;
        }
        
        #flamegraph {
            background: #f5f5f5;
            border-radius: 8px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .error {
            color: #f44336;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔨 Forge Build Dashboard</h1>
            <div class="status">
                <div class="status-item">
                    <div class="status-value" id="total-builds">0</div>
                    <div class="status-label">Total Builds</div>
                </div>
                <div class="status-item">
                    <div class="status-value" id="success-rate">0%</div>
                    <div class="status-label">Success Rate</div>
                </div>
                <div class="status-item">
                    <div class="status-value" id="cache-hit-rate">0%</div>
                    <div class="status-label">Cache Hit Rate</div>
                </div>
            </div>
        </header>
        
        <div class="builds-grid" id="builds-container">
            <div class="loading">Loading builds...</div>
        </div>
        
        <div class="flamegraph-container" id="flamegraph-section" style="display: none;">
            <div class="flamegraph-title">Build Flamegraph</div>
            <div id="flamegraph"></div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api';
        
        async function fetchBuilds() {
            try {
                const response = await fetch(`${API_BASE}/builds`);
                const data = await response.json();
                if (data.success) {
                    return data.data;
                }
                return [];
            } catch (error) {
                console.error('Failed to fetch builds:', error);
                return [];
            }
        }
        
        async function fetchFlamegraph(buildId) {
            try {
                const response = await fetch(`${API_BASE}/builds/${buildId}/flamegraph`);
                const data = await response.json();
                if (data.success) {
                    return data.data;
                }
                return null;
            } catch (error) {
                console.error('Failed to fetch flamegraph:', error);
                return null;
            }
        }
        
        function formatDuration(ms) {
            if (!ms) return 'N/A';
            if (ms < 1000) return `${ms}ms`;
            if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
            return `${(ms / 60000).toFixed(1)}m`;
        }
        
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString();
        }
        
        function getStatusClass(status) {
            switch (status) {
                case 'Success': return 'status-success';
                case 'Failed': return 'status-failed';
                case 'Running': return 'status-running';
                default: return '';
            }
        }
        
        function renderBuilds(builds) {
            const container = document.getElementById('builds-container');
            
            if (builds.length === 0) {
                container.innerHTML = '<div class="loading">No builds found</div>';
                return;
            }
            
            container.innerHTML = builds.map(build => `
                <div class="build-card">
                    <div class="build-header">
                        <span class="build-id">${build.build_id.substring(0, 8)}</span>
                        <span class="build-status ${getStatusClass(build.status)}">${build.status}</span>
                    </div>
                    <div class="build-info">
                        <div>
                            <div class="info-label">Project</div>
                            <div class="info-value">${build.project_name}</div>
                        </div>
                        <div>
                            <div class="info-label">Backend</div>
                            <div class="info-value">${build.backend}</div>
                        </div>
                        <div>
                            <div class="info-label">Duration</div>
                            <div class="info-value">${formatDuration(build.duration_ms)}</div>
                        </div>
                        <div>
                            <div class="info-label">Started</div>
                            <div class="info-value">${formatDate(build.start_time)}</div>
                        </div>
                        <div>
                            <div class="info-label">Tasks</div>
                            <div class="info-value">${build.tasks.length}</div>
                        </div>
                        <div>
                            <div class="info-label">Cache Hit Rate</div>
                            <div class="info-value">${(build.cache_stats.hit_rate * 100).toFixed(1)}%</div>
                        </div>
                    </div>
                    <div class="build-actions">
                        <button class="btn btn-primary" onclick="showFlamegraph('${build.build_id}')">View Flamegraph</button>
                    </div>
                </div>
            `).join('');
            
            // Update stats
            document.getElementById('total-builds').textContent = builds.length;
            
            const successCount = builds.filter(b => b.status === 'Success').length;
            document.getElementById('success-rate').textContent = `${((successCount / builds.length) * 100).toFixed(1)}%`;
            
            const avgCacheRate = builds.reduce((sum, b) => sum + b.cache_stats.hit_rate, 0) / builds.length;
            document.getElementById('cache-hit-rate').textContent = `${(avgCacheRate * 100).toFixed(1)}%`;
        }
        
        async function showFlamegraph(buildId) {
            const section = document.getElementById('flamegraph-section');
            const container = document.getElementById('flamegraph');
            
            section.style.display = 'block';
            container.innerHTML = '<div class="loading">Loading flamegraph...</div>';
            
            const fg = await fetchFlamegraph(buildId);
            if (fg) {
                const svg = await generateFlamegraphSVG(fg);
                container.innerHTML = svg;
                section.scrollIntoView({ behavior: 'smooth' });
            } else {
                container.innerHTML = '<div class="error">Failed to load flamegraph</div>';
            }
        }
        
        async function generateFlamegraphSVG(fg) {
            // Simple SVG generation (in production, this would be more sophisticated)
            const width = 800;
            const height = Math.max(400, fg.task_count * 30 + 50);
            
            let svg = `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">`;
            svg += `<rect width="100%" height="100%" fill="#f5f5f5"/>`;
            
            let y = 10;
            const totalDuration = fg.total_duration_ms || 1;
            
            function renderNode(node, x, depth) {
                const nodeWidth = (node.value / totalDuration) * 780;
                const color = node.name.includes('cached') ? '#2196F3' : '#4CAF50';
                
                svg += `<rect x="${x + 10}" y="${y}" width="${Math.max(nodeWidth, 20)}" height="25" fill="${color}" stroke="#333" stroke-width="1"/>`;
                svg += `<text x="${x + 15}" y="${y + 17}" font-family="Arial" font-size="12" fill="white">${node.name}</text>`;
                
                y += 30;
                
                let childX = x;
                for (const child of node.children) {
                    renderNode(child, childX, depth + 1);
                    childX += (child.value / totalDuration) * 780;
                }
            }
            
            renderNode(fg.root, 0, 0);
            svg += '</svg>';
            
            return svg;
        }
        
        // Initialize
        async function init() {
            const builds = await fetchBuilds();
            renderBuilds(builds);
            
            // Auto-refresh every 10 seconds
            setInterval(async () => {
                const updatedBuilds = await fetchBuilds();
                renderBuilds(updatedBuilds);
            }, 10000);
        }
        
        init();
    </script>
</body>
</html>
