[package]
name = "forge-docker-builder"
version = "0.1.0"
edition = "2024"
authors = ["Foursavage Dev <foursavage@proton.me>"]
license = "MIT"
repository = "https://github.com/foursavage-dev/forge-rs"
description = "Docker image building as first-class artifacts for Forge"
keywords = ["docker", "containers", "images", "artifacts"]
categories = ["development-tools"]

[dependencies]
forge-core = { path = "../forge-core" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
bollard = "0.17"
