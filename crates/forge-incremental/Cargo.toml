[package]
name = "forge-incremental"
version = "0.2.0"
edition = "2024"
authors = ["Foursavage Dev <foursavage@proton.me>"]
license = "MIT"
repository = "https://github.com/foursavage-dev/forge-rs"
description = "Incremental build analysis for Forge"
keywords = ["incremental", "analysis", "build", "optimization"]
categories = ["development-tools"]

[dependencies]
forge-core = { path = "../forge-core" }
forge-graph = { path = "../forge-graph" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
