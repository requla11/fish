[package]
name = "forge-multiplatform"
version = "0.1.0"
edition = "2024"
authors = ["Foursavage Dev <foursavage@proton.me>"]
license = "MIT"
repository = "https://github.com/foursavage-dev/forge-rs"
description = "Multi-platform CI matrix generator for Forge"
keywords = ["ci", "matrix", "multiplatform", "cross-platform"]
categories = ["development-tools"]

[dependencies]
forge-core = { path = "../forge-core" }
forge-ci-generator = { path = "../forge-ci-generator" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
