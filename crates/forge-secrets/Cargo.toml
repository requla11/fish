[package]
name = "forge-secrets"
version = "0.1.0"
edition = "2024"
authors = ["Foursavage Dev <team@foursavage.dev>"]
license = "MIT"
repository = "https://github.com/foursavage-dev/forge-rs"
description = "Secret management integration for Forge"
keywords = ["secrets", "vault", "security", "credentials"]
categories = ["development-tools"]

[dependencies]
forge-core = { path = "../forge-core" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
