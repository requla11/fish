[package]
name = "forge-security"
version = "0.1.0"
edition = "2024"
authors = ["Foursavage Dev <team@foursavage.dev>"]
license = "MIT"
repository = "https://github.com/foursavage-dev/forge-rs"
description = "Dependency vulnerability scanner for Forge"
keywords = ["security", "vulnerability", "scanner", "audit"]
categories = ["development-tools"]

[dependencies]
forge-core = { path = "../forge-core" }

thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
semver = "1.0"

[dev-dependencies]
tempfile = "3.10"
