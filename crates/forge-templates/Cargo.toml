[package]
name = "forge-templates"
version = "0.1.0"
edition = "2024"
authors = ["Foursavage Dev <team@foursavage.dev>"]
license = "MIT"
repository = "https://github.com/foursavage-dev/forge-rs"
description = "Build pipeline templates for Forge"
keywords = ["templates", "pipelines", "workflows", "reusable"]
categories = ["development-tools"]

[dependencies]
forge-core = { path = "../forge-core" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
handlebars = "6.0"
