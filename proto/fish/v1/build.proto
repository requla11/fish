syntax = "proto3";

package fish.v1;

option go_package = "github.com/requla11/fish/go/pkg/proto/v1;fishv1";

message BuildTask {
  string id = 1;
  string package_name = 2;
  string toolchain = 3;
  string command = 4;
  repeated string args = 5;
  repeated string inputs = 6;
  repeated string outputs = 7;
  repeated string dependencies = 8;
  map<string, string> env = 9;
  int64 timeout_ms = 10;
}

message TaskResult {
  string task_id = 1;
  int32 exit_code = 2;
  string stdout = 3;
  string stderr = 4;
  int64 duration_ms = 5;
  bool cached = 6;
  string fingerprint = 7;
  map<string, string> output_digests = 8;
}

message BuildGraph {
  string root_package = 1;
  repeated BuildTask tasks = 2;
  repeated string execution_order = 3;
}

message DiagnosticReport {
  string run_id = 1;
  string status = 2;
  int64 total_duration_ms = 3;
  int32 tasks_total = 4;
  int32 tasks_succeeded = 5;
  int32 tasks_failed = 6;
  int32 tasks_cached = 7;
  repeated TaskResult failed_tasks = 8;
}
